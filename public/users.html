<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Tài Khoản - TaskMaster</title>
  <script>try{const root=document.documentElement;root.dataset.theme=localStorage.getItem('DACK_THEME')==='dark'?'dark':'light';root.dataset.sidebarCollapsed=localStorage.getItem('DACK_SIDEBAR_HIDDEN')==='true'?'true':'false'}catch{document.documentElement.dataset.theme='light';document.documentElement.dataset.sidebarCollapsed='false'}</script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="image/favicon-light.png?v=5">
</head>
<body class="auth-pending">
  <div class="app-container">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <a href="index.html" class="sidebar-brand" aria-label="TaskMaster home">
        <div class="brand-icon">TM</div>
        <div class="brand-text">Task<span>Master</span></div>
      </a>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-group">
          <span class="sidebar-group-label">Tổng quan &amp; Công việc</span>
          <a href="index.html" class="nav-link" aria-label="Dashboard Thống kê">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10.5 12 3l9 7.5M5.25 9v11h13.5V9M9 20v-6h6v6"/></svg>
            <span class="nav-link-label">Dashboard Thống kê</span>
          </a>
          <a href="tasks.html" class="nav-link" aria-label="Danh sách công việc">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            <span class="nav-link-label">Danh sách công việc</span>
          </a>
          <a href="my-tasks.html" class="nav-link" aria-label="Việc của tôi">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2m8-10a4 4 0 100-8 4 4 0 000 8z"/></svg>
            <span class="nav-link-label">Việc của tôi</span>
          </a>
          <a href="my-calendar.html" class="nav-link" aria-label="Lịch tuần">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 012 2v14H3V6a2 2 0 012-2z"/></svg>
            <span class="nav-link-label">Lịch tuần</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="author-card">
          <div class="avatar" id="user-avatar">AD</div>
          <div class="author-info">
            <h4 id="sidebar-user-name">Admin</h4>
            <p id="sidebar-user-role">Administrator</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="mobile-menu-btn" aria-label="Mở menu" aria-expanded="false">
            <svg class="menu-open-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            <svg class="menu-close-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <h1 class="page-title">Quản Lý Tài Khoản</h1>
        </div>
        <div class="navbar-right"></div>
      </header>

      <div class="page-body">
        <div class="users-layout">
          <!-- Cột trái: Form tạo tài khoản -->
          <section class="card user-create-card">
            <div class="user-form-header">
              <h2>+ Tạo Tài Khoản Mới</h2>
              <p class="text-muted">Cấp tài khoản và phân quyền cho nhân sự</p>
            </div>

            <form id="user-form" class="user-form">
              <div class="form-group">
                <label class="form-label" for="user-name-input">Họ và tên <span class="required">*</span></label>
                <input id="user-name-input" class="form-control" name="name" required minlength="2" placeholder="VD: Nguyễn Văn A">
              </div>

              <div class="user-form-row">
                <div class="form-group">
                  <label class="form-label" for="user-username-input">Tên đăng nhập <span class="required">*</span></label>
                  <input id="user-username-input" class="form-control" name="username" required minlength="3" placeholder="vd: nguyenvana" autocomplete="off">
                </div>

                <div class="form-group">
                  <label class="form-label" for="user-role-select">Vai trò <span class="required">*</span></label>
                  <select id="user-role-select" class="form-control is-custom-hidden" name="role">
                    <option value="user" data-color="#10b981">Người dùng</option>
                    <option value="manager" data-color="#0284c7">Quản lý</option>
                  </select>
                </div>
              </div>

              <div class="user-form-row">
                <div class="form-group">
                  <label class="form-label" for="user-email-input">Email <span class="required">*</span></label>
                  <input id="user-email-input" class="form-control" name="email" type="email" autocomplete="email" placeholder="ten@congty.vn" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="user-phone-input">Số điện thoại</label>
                  <input id="user-phone-input" class="form-control" name="phone" type="tel" autocomplete="tel" placeholder="09xx xxx xxx">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="user-password-input">Mật khẩu khởi tạo <span class="required">*</span></label>
                <div class="auth-input-wrap has-toggle user-password-wrap">
                  <input id="user-password-input" class="form-control" name="password" type="password" required minlength="10" maxlength="128" placeholder="Ít nhất 10 ký tự" autocomplete="new-password">
                  <button type="button" id="toggle-user-password" class="auth-password-toggle" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>

              <button class="btn btn-primary user-submit" type="submit">+ Tạo tài khoản</button>
            </form>
          </section>

          <!-- Cột phải: Danh sách người dùng -->
          <section class="card user-list-card">
            <div class="user-list-header">
              <div class="user-list-title-wrap">
                <h2>Danh Sách Người Dùng</h2>
                <span class="user-count" id="user-count">0 tài khoản</span>
              </div>

              <div class="user-list-tools">
                <div class="user-search-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
                  <input type="search" id="user-search-input" class="form-control" placeholder="Tìm tên, @username, email..." autocomplete="off">
                </div>

                <select id="user-role-filter" class="filter-select is-custom-hidden" aria-label="Lọc theo vai trò">
                  <option value="all">Vai trò</option>
                  <option value="manager" data-color="#0284c7">Quản lý</option>
                  <option value="user" data-color="#10b981">Người dùng</option>
                </select>
              </div>
            </div>

            <div class="table-responsive" style="border: none; border-radius: 0;">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>Người dùng</th>
                    <th>Liên hệ &amp; Xác minh</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th style="text-align: right;">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/users.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
