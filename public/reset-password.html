<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Đặt lại mật khẩu - TaskMaster</title>
  <script>try{const root=document.documentElement;root.dataset.theme=localStorage.getItem('DACK_THEME')==='dark'?'dark':'light';root.dataset.sidebarCollapsed=localStorage.getItem('DACK_SIDEBAR_HIDDEN')==='true'?'true':'false'}catch{document.documentElement.dataset.theme='light';document.documentElement.dataset.sidebarCollapsed='false'}</script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="image/favicon-light.png?v=5">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-wide">
    <div class="auth-brand">
      <span class="global-brand-mark"><img src="assets/taskmaster-logo-light.png?v=5" alt="TaskMaster"></span>
      <span class="brand-text">Task<span>Master</span></span>
    </div>
    <p class="eyebrow">KHÔI PHỤC BẢO MẬT</p>
    <h1>Đặt lại mật khẩu</h1>
    <p class="auth-subtitle" id="reset-subtitle">Thiết lập mật khẩu mới cho tài khoản TaskMaster của bạn.</p>

    <form id="reset-password-form">
      <div id="manual-code-fields" hidden>
        <div class="form-group">
          <label class="form-label" for="reset-email">Email hoặc Tên đăng nhập</label>
          <input class="form-control" id="reset-email" name="email" type="text" autocomplete="username email" placeholder="Nhập email hoặc tên đăng nhập">
        </div>
        <div class="form-group">
          <label class="form-label" for="reset-code">Mã xác nhận 6 chữ số (OTP)</label>
          <input class="form-control otp-code-input" id="reset-code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Nhập 6 chữ số">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="new-password">Mật khẩu mới (ít nhất 10 ký tự)</label>
        <input class="form-control" id="new-password" name="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="Nhập mật khẩu mới" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Nhập lại mật khẩu mới</label>
        <input class="form-control" id="confirm-password" name="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="Xác nhận mật khẩu mới" required>
      </div>
      <div id="reset-message" class="auth-alert" role="status" hidden></div>
      <button class="btn btn-primary auth-submit" type="submit" id="reset-submit-btn">Cập nhật mật khẩu</button>
    </form>

    <p class="auth-subtitle"><a href="forgot-password.html">Gửi lại mã xác nhận</a> &middot; <a href="login.html">Quay lại đăng nhập</a></p>
  </main>
  <script type="module" src="js/reset-password.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
