<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - TaskMaster</title>
  <script>try{const root=document.documentElement;root.dataset.theme=localStorage.getItem('DACK_THEME')==='dark'?'dark':'light';root.dataset.sidebarCollapsed=localStorage.getItem('DACK_SIDEBAR_HIDDEN')==='true'?'true':'false'}catch{document.documentElement.dataset.theme='light';document.documentElement.dataset.sidebarCollapsed='false'}</script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="image/favicon-light.png?v=5">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-wide">
    <div class="auth-brand">
      <span class="global-brand-mark"><img src="assets/taskmaster-logo-light.png?v=5" alt="TaskMaster"></span>
      <span class="brand-text">Task<span>Master</span></span>
    </div>
    <p class="eyebrow">KHÔI PHỤC TÀI KHOẢN</p>
    <h1>Quên mật khẩu?</h1>
    <p class="auth-subtitle" id="forgot-subtitle">Nhập địa chỉ email của bạn để nhận mã xác thực OTP 6 chữ số.</p>

    <div class="otp-steps-bar" id="forgot-steps-bar">
      <div class="otp-step-pill is-active" id="step-pill-1">
        <span class="otp-step-num">1</span>
        <span>Nhập Email</span>
      </div>
      <div class="otp-step-line"></div>
      <div class="otp-step-pill" id="step-pill-2">
        <span class="otp-step-num">2</span>
        <span>Xác thực OTP</span>
      </div>
    </div>

    <form id="forgot-password-form">
      <div class="form-group">
        <label class="form-label" for="email">Địa chỉ Email hoặc Tên đăng nhập</label>
        <input class="form-control" id="email" name="email" type="text" autocomplete="username email" placeholder="nhap-email-cua-ban@gmail.com" required>
      </div>
      <div id="forgot-message" class="auth-alert" role="status" hidden></div>
      <button class="btn btn-primary auth-submit otp-send-btn" type="submit" id="forgot-submit-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
        <span>Gửi mã xác thực OTP</span>
      </button>
    </form>

    <form id="otp-reset-form" class="otp-reset-panel" hidden>
      <div class="otp-target-bar">
        <div class="otp-target-chip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
          <span id="otp-target-email-label">Đã gửi mã tới email của bạn</span>
        </div>
        <span class="otp-timer-badge" id="forgot-otp-timer">05:00</span>
      </div>

      <div class="form-group">
        <div class="otp-entry-header">
          <label class="form-label" for="otp-code">Mã xác thực OTP (6 chữ số)</label>
          <button type="button" class="otp-resend-link" id="otp-resend-btn">Gửi lại mã</button>
        </div>
        <input id="otp-code" name="code" type="hidden" value="">
        <div class="otp-pin-grid" data-otp-group="forgot">
          <input type="text" class="otp-digit-box" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chữ số OTP 1" autocomplete="one-time-code">
          <input type="text" class="otp-digit-box" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chữ số OTP 2">
          <input type="text" class="otp-digit-box" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chữ số OTP 3">
          <span class="otp-pin-sep" aria-hidden="true">&ndash;</span>
          <input type="text" class="otp-digit-box" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chữ số OTP 4">
          <input type="text" class="otp-digit-box" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chữ số OTP 5">
          <input type="text" class="otp-digit-box" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chữ số OTP 6">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="otp-new-password">Mật khẩu mới (ít nhất 10 ký tự)</label>
        <input class="form-control" id="otp-new-password" name="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="Nhập mật khẩu mới" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="otp-confirm-password">Nhập lại mật khẩu mới</label>
        <input class="form-control" id="otp-confirm-password" name="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="Xác nhận mật khẩu mới" required>
      </div>
      <div id="otp-reset-message" class="auth-alert" role="status" hidden></div>
      <button class="btn btn-primary auth-submit otp-confirm-btn" type="submit" id="otp-reset-submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Xác nhận đổi mật khẩu</span>
      </button>
    </form>

    <p class="auth-subtitle"><a href="login.html">&larr; Quay lại đăng nhập</a></p>
  </main>
  <script type="module" src="js/forgot-password.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
