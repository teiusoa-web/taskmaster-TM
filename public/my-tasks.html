<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Công Việc - TaskMaster</title>
  <script>try{const root=document.documentElement;root.dataset.theme=localStorage.getItem('DACK_THEME')==='dark'?'dark':'light';root.dataset.sidebarCollapsed=localStorage.getItem('DACK_SIDEBAR_HIDDEN')==='true'?'true':'false'}catch{document.documentElement.dataset.theme='light';document.documentElement.dataset.sidebarCollapsed='false'}</script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="image/favicon-light.png?v=5">
</head>
<body class="auth-pending" data-task-view="my-tasks">
  <div class="app-container">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <a href="index.html" class="sidebar-brand" aria-label="TaskMaster home"><div class="brand-icon">✓</div>
        <div class="brand-text">Task<span>Master</span></div></a>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-group">
          <span class="sidebar-group-label">Tổng quan &amp; Công việc</span>
          <a href="index.html" class="nav-link" aria-label="Dashboard Thống kê">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10.5 12 3l9 7.5M5.25 9v11h13.5V9M9 20v-6h6v6"/></svg>
            <span class="nav-link-label">Dashboard Thống kê</span>
          </a>
          <a href="tasks.html" class="nav-link" aria-label="Danh sách công việc">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            <span class="nav-link-label">Danh sách công việc</span>
          </a>
          <a href="my-tasks.html" class="nav-link active" aria-label="Việc của tôi">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2m8-10a4 4 0 100-8 4 4 0 000 8z"/></svg>
            <span class="nav-link-label">Việc của tôi</span>
          </a>
          <a href="my-calendar.html" class="nav-link" aria-label="Lịch tuần">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 012 2v14H3V6a2 2 0 012-2z"/></svg>
            <span class="nav-link-label">Lịch tuần</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="author-card">
          <div class="avatar"></div>
          <div class="author-info">
            <h4></h4>
            <p></p>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="mobile-menu-btn" aria-label="Mở menu" aria-expanded="false"><svg class="menu-open-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg><svg class="menu-close-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"/></svg></button>
          <h1 class="page-title">Vi&#7879;c c&#7911;a t&#244;i</h1>
        </div>
        <div class="navbar-right">
          <a href="task-form.html" class="btn-quick-add">
            <span>+ Tạo việc mới</span>
          </a>
        </div>
      </header>

      <div class="page-body">
        <!-- BỘ LỌC, TÌM KIẾM, SẮP XẾP (Đạt tiêu chí mục 9) -->
        <section class="filter-bar">
          <div class="search-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="search-task" placeholder="Tìm kiếm theo tên công việc, từ khóa..." />
          </div>

          <select id="filter-status" class="filter-select">
            <option value="all">Trạng thái</option>
            <option value="pending">Chờ xử lý</option>
            <option value="in-progress">Đang làm</option>
            <option value="awaiting-review">Chờ admin duyệt</option>
            <option value="needs-revision">Cần làm lại</option>
            <option value="completed">Đã hoàn thành</option>
            <option value="cancelled">Đã hủy</option>
          </select>

          <select id="filter-category" class="filter-select">
            <option value="all">Danh mục</option>
          </select>

          <select id="filter-priority" class="filter-select">
            <option value="all">Mức ưu tiên</option>
            <option value="high">Ưu tiên: Cao</option>
            <option value="medium">Ưu tiên: Trung bình</option>
            <option value="low">Ưu tiên: Thấp</option>
          </select>

          <select id="filter-assignee" class="filter-select" hidden aria-label="Lọc theo tài khoản người dùng">
            <option value="all">Người dùng</option>
          </select>

          <select id="sort-by" class="filter-select">
            <option value="deadline-asc">Hạn chót: Gần nhất trước</option>
            <option value="deadline-desc">Hạn chót: Xa nhất trước</option>
            <option value="priority-desc">Mức độ ưu tiên cao nhất</option>
            <option value="title-az">Tên công việc (A → Z)</option>
            <option value="title-za">Tên công việc (Z → A)</option>
          </select>
        </section>

        <!-- BẢNG DANH SÁCH -->
        <section class="card" style="padding: 0; overflow: hidden;">
          <div style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
            <h2 style="font-size: 1rem; font-weight: 700;">Danh Sách Hiển Thị</h2>
            <span class="badge badge-neutral" id="task-count-badge">0 công việc</span>
          </div>

          <div class="table-responsive" style="border: none; border-radius: 0;">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Tên công việc</th>
                  <th>Danh mục</th>
                  <th>Ng&#432;&#7901;i nh&#7853;n</th>
                  <th>Mức ưu tiên</th>
                  <th>Hạn chót</th><th>Tiến độ</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="task-table-body">
                <!-- Render động bởi tasks.js -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- SCRIPT ES6 MODULES -->
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/tasks.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
