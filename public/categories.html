<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Danh Mục - TaskMaster</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-pending">
  <div class="app-container">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <a href="index.html" class="sidebar-brand" aria-label="TaskMaster home"><div class="brand-icon">✓</div>
        <div class="brand-text">Task<span>Master</span></div></a>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard Thống Kê
        </a>
        <a href="tasks.html" class="nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          Danh sách công việc
        </a>
        <a href="task-form.html" class="nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Thêm mới công việc
        </a>
        <a href="categories.html" class="nav-link active">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Quản lý danh mục
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="author-card">
          <div class="avatar"></div>
          <div class="author-info">
            <h4></h4>
            <p></p>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="mobile-menu-btn" aria-label="Mở menu" aria-expanded="false"><svg class="menu-open-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg><svg class="menu-close-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"/></svg></button>
          <h1 class="page-title">Quản Lý Danh Mục / Dự Án</h1>
        </div>
      </header>

      <div class="page-body">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;">
          <!-- Cột Form thêm danh mục -->
          <div class="card" style="height: fit-content;">
            <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 16px;">+ Thêm Danh Mục Mới</h2>
            <form id="add-category-form">
              <div class="form-group">
                <label for="cat-name" class="form-label">Tên danh mục <span class="required">*</span></label>
                <input type="text" id="cat-name" class="form-control" placeholder="VD: Marketing, Nghiên cứu..." required />
              </div>

              <div class="form-group">
                <label for="cat-color" class="form-label">Màu sắc đại diện</label>
                <input type="color" id="cat-color" class="form-control" value="#4f46e5" style="height: 44px; padding: 4px; cursor: pointer;" />
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%;">Tạo Danh Mục</button>
            </form>
          </div>

          <!-- Cột Danh sách hiện có -->
          <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 16px 20px; border-bottom: 1px solid var(--border-color);">
              <h2 style="font-size: 1.1rem; font-weight: 700;">Danh Sách Danh Mục Đang Có</h2>
            </div>
            <div class="table-responsive" style="border: none;">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>Tên danh mục</th>
                    <th>Số công việc</th>
                    <th>Mã màu</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="categories-table-body">
                  <!-- Render động bởi categories.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- SCRIPT ES6 MODULES -->
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/categories.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
